name: NASA Scan
on: workflow_dispatch

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install httpx
        run: |
          sudo apt update
          sudo apt install -y golang-go
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Run scan
        run: httpx -l interesting_subs.txt -o results.txt -status-code -title -tech-detect -follow-redirects -threads 50 -timeout 5
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: results.txt